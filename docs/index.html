<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f2f2ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="오프라인 개인 가계부">
  <title>가계부</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <main id="view"></main>
  </div>

  <button class="fab" id="fab" data-act="add" aria-label="내역 추가">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" aria-label="메뉴">
    <button data-act="tab" data-v="home" class="on">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span>내역</span>
    </button>
    <button data-act="tab" data-v="calendar">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>달력</span>
    </button>
    <button data-act="tab" data-v="stats">
      <svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5M3 20.5h18"/></svg><span>통계</span>
    </button>
    <button data-act="tab" data-v="settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>설정</span>
    </button>
  </nav>

  <div id="sheets"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-in" accept=".json,.txt,application/json,text/plain" hidden>

  <script src="app.js"></script>
</body>
</html>
